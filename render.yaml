# Render Blueprint: deploys the API and the website together.
# In Render: New > Blueprint > pick this GitHub repo > Apply.
services:
  - type: web
    name: season-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: season-planner
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's address, filled in by Render
      - key: VITE_API_URL
        fromService:
          type: web
          name: season-planner-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
